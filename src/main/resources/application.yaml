spring:
  datasource:
    url: jdbc:sqlite:database.sqlite
    username: admin
    password: admin
    driver-class-name: org.sqlite.JDBC
    hikari:
      data-source-properties:
        date_class: "text"
        date_string_format: "yyyy-MM-dd"
        timestamp_string_format: "yyyy-MM-dd HH:mm:ss"
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
springdoc:
  packages-to-scan: ru.dmc3105.webapp.controller
  paths-to-match: /**