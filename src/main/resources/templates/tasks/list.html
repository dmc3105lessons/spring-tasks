<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>
<body  class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4"
            th:text="${message}">
            Заголовок
        </h1>

        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 mb-3">Список задач</h2>

                <div th:if="${#lists.isEmpty(tasks)}"
                     class="alert alert-info">
                    Задач пока нет
                </div>1

                <div class="list-group"
                     th:unles="${#lists.isEmpty(tasks)}">
                    <a th:each="task : ${tasks}"
                       th:href="@{/tasks/{id}(id=${task.id})}"
                       class="list-group-item list-group-item-action">
                        <div class="d-flex justify-content-between">
                            <strong th:text="${task.title}">
                                Название задачи
                            </strong>

                            <span th:text="${task.status}">
                                NEW
                            </span>
                        </div>

                        <small class="text-muted" th:text="${task.priority}">
                            MEDIUM
                        </small>
                    </a>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
